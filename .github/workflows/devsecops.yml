name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-linting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install backend dependencies & security tools
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety pip-audit pytest

    - name: Python SAST (Bandit)
      run: |
        cd backend
        bandit -r . -x ./venv,./tests -ll -ii

    - name: Dependency Vulnerability Audit (Pip-Audit & Safety)
      run: |
        cd backend
        pip-audit || echo "pip-audit completed with warnings."
        safety check -r requirements.txt || echo "Safety check completed with warnings."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Frontend Dependency Vulnerability Audit (npm audit)
      run: |
        cd frontend
        npm audit || echo "npm audit found vulnerabilities, review them."
